<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Results Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }

body{
  font-family:'Inter',sans-serif;
  background:#f4f6f8;
  margin:0;
}

/* MAIN CARD */
.container{
  width:95%;
  max-width:520px;
  margin:30px auto;
  padding:22px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

/* ===== FORM LAYOUT ===== */
#formLayout .logo{
  width:110px;
  display:block;
  margin:0 auto 10px;
}

h2{
  margin:2px 0;
  text-align:center;
  color:#222;
}

.subtitle{
  text-align:center;
  color:#0f7a41;
  font-style:italic;
  font-size:14px;
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:14px;
  font-weight:600;
  font-size:14px;
}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  font-size:16px;
  border:1px solid #bbb;
  border-radius:6px;
}

button{
  width:100%;
  padding:13px;
  margin-top:22px;
  background:#0f7a41;
  color:#fff;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* ===== REPORT LAYOUT ===== */
#reportLayout{
  display:none;
  text-align:center;
}

#reportLayout img{
  width:70px;
  margin-top:10px;
}

#reportTitle{
  color:#0f7a41;
  font-weight:700;
  margin:10px 0 14px;
}

.viewer{
  height:78vh;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

.viewer iframe{
  width:100%;
  height:100%;
  border:none;
}

/* ===== SPINNER ===== */
.spinner-overlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #e5e7eb;
  border-top:6px solid #0f7a41;
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">

  <!-- ===== FORM VIEW ===== -->
  <div id="formLayout">
    <img src="logo.png" class="logo">
    <h2>Blantyre Secondary School</h2>
    <div class="subtitle">"Success Comes Through Discipline"</div>

    <form id="resultForm">
      <label>Examination Number</label>
      <input type="text" id="examNo" required>

      <label>Date of Birth</label>
      <input type="date" id="dob" required>

      <button type="submit">View Report</button>
    </form>
  </div>

  <!-- ===== REPORT VIEW ===== -->
  <div id="reportLayout">
    <img src="logo.png">
    <h2>ResultsHub</h2>
    <div style="color:#666;font-size:14px;">EXAMINATION RESULTS PORTAL</div>
    <div style="color:#f59e0b;font-style:italic;font-size:13px;margin:6px 0;">
      Fast • Secure • Reliable
    </div>

    <div id="reportTitle"></div>

    <div class="viewer">
      <iframe id="bigReportFrame"></iframe>
    </div>
  </div>

</div>

<div class="spinner-overlay" id="spinner">
  <div class="spinner"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzzC86FpXhAXlDdfV_zENIclzh3puUtS-0LuKe0ToFMeYsK6HSW2C_vwjoar7WrDU1q/exec";

const form = document.getElementById("resultForm");
const spinner = document.getElementById("spinner");
const formLayout = document.getElementById("formLayout");
const reportLayout = document.getElementById("reportLayout");
const bigFrame = document.getElementById("bigReportFrame");
const reportTitle = document.getElementById("reportTitle");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const examNo = document.getElementById("examNo").value.trim();
  const dob = document.getElementById("dob").value;

  spinner.style.display = "flex";

  try {
    const res = await fetch(`${API_URL}?examNo=${encodeURIComponent(examNo)}&dob=${dob}`);
    const data = await res.json();

    spinner.style.display = "none";

    if (data.status === "success") {
      formLayout.style.display = "none";
      reportLayout.style.display = "block";
      reportTitle.textContent = `Examination Report – ${examNo}`;
      bigFrame.src = data.pdf;
    } else {
      alert("Result not found");
    }

  } catch (err) {
    spinner.style.display = "none";
    alert("Connection error");
  }
});
</script>

</body>
</html>
