<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Results Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Inter',sans-serif;
  background:#f4f4f4;
}

/* MAIN CONTAINER */
.container{
  width:95%;
  max-width:520px;
  margin:40px auto;
  padding:28px 24px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

/* LOGO */
.logo{
  width:95px;
  display:block;
  margin:0 auto 18px;
}

/* HEADER */
.header-section{
  text-align:center;
  margin-bottom:20px;
}

.school-name{
  font-size:18px;
  font-weight:800;
  color:#000;
  letter-spacing:-0.5px;
  margin-bottom:8px;
  font-family:'Inter',sans-serif;
}

.portal-title{
  text-align:center;
  font-size:34px;
  font-weight:900;
  line-height:1;
  letter-spacing:-1px;
  color:#000;
  margin-top:2px;
  margin-bottom:6px;
  text-transform:uppercase;
}

.subtitle{
  text-align:center;
  color:#C9A227;
  font-style:italic;
  font-size:15px;
  margin-top:0;
  margin-bottom:10px;
  font-weight:500;
}

/* FORM */
label{
  display:block;
  margin-top:14px;
  font-weight:600;
  color:#222;
}

input{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #cfcfcf;
  border-radius:6px;
  font-size:15px;
  outline:none;
  transition:0.2s ease;
}

input:focus{
  border-color:#C9991A;
  box-shadow:0 0 0 3px rgba(201,153,26,0.15);
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  margin-top:24px;
  background:#C9991A;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  transition:0.25s ease;
}

button:hover{
  background:#b88c17;
  transform:translateY(-2px);
}

/* FULL SCREEN PDF VIEWER */
.viewer{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9998;
}

.viewer iframe{
  width:100%;
  height:100%;
  border:none;
}

/* LOADING SPINNER */
.spinner-overlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #e5e7eb;
  border-top:6px solid #000;
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* FOOTER */
.footer{
  margin-top:20px;
  padding-top:14px;
  border-top:1px solid #eee;
  text-align:center;
  font-size:12px;
  color:#777;
}

.footer a{
  color:#C9991A;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <img src="logo.png" class="logo">

  <!-- HEADER -->
  <div class="header-section">
    <div class="school-name">
      Blantyre Secondary School
    </div>

    <div class="portal-title">
      EXAMINATION RESULTS PORTAL
    </div>
  </div>

  <!-- MOTTO -->
  <div class="subtitle">
    "Success Comes Through Discipline"
  </div>

  <!-- FORM -->
  <form id="resultForm">

    <label for="examNo">
      Examination Number
    </label>

    <input 
      type="text" 
      id="examNo" 
      placeholder="Enter Examination Number"
      required
    >

    <label for="dob">
      Date of Birth
    </label>

    <input 
      type="date" 
      id="dob"
      required
    >

    <button type="submit">
      View Report
    </button>

  </form>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 BSS • 
    <a href="https://wa.me/265888735511" target="_blank">
      JK DIGITAL HUB
    </a>
  </div>

</div>

<!-- FULL SCREEN PDF VIEWER -->
<div class="viewer" id="viewer">
  <iframe id="bigReportFrame"></iframe>
</div>

<!-- LOADING -->
<div class="spinner-overlay" id="spinner">
  <div class="spinner"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzjbYEhAzo5dwOGFAYc6b7ueokt_cFxGqFENxz43Cnm8MxJ9Np7WFuaH28nrwrGEN8/exec";

const form = document.getElementById("resultForm");
const spinner = document.getElementById("spinner");
const viewer = document.getElementById("viewer");
const bigFrame = document.getElementById("bigReportFrame");

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const examNo = document.getElementById("examNo").value.trim();
  const dob = document.getElementById("dob").value;

  spinner.style.display = "flex";

  try{

    const res = await fetch(
      `${API_URL}?examNo=${encodeURIComponent(examNo)}&dob=${dob}`
    );

    const data = await res.json();

    spinner.style.display = "none";

    if(data.status === "success"){

      viewer.style.display = "block";
      bigFrame.src = data.pdf;

    }else{

      alert("Result not found");

    }

  }catch(err){

    spinner.style.display = "none";
    alert("Connection error");

  }

});
</script>

</body>
</html>
