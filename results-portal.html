<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Results Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }
body{ font-family:'Inter',sans-serif; background:#f4f6f8; margin:0; }

.container{
  width:95%;
  max-width:520px;
  margin:30px auto;
  padding:22px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.logo{
  width:110px;
  display:block;
  margin:0 auto 10px;
}

h2{ text-align:center; margin:2px 0; }
.subtitle{
  text-align:center;
  color:#C9A227;
  font-style:italic;
  font-size:14px;
  margin-bottom:15px;
}

label{ display:block; margin-top:14px; font-weight:600; }
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #bbb;
  border-radius:6px;
}

button{
  width:100%;
  padding:13px;
  margin-top:22px;
  background:#C9A227;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* FULL SCREEN VIEWER */
.viewer{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9998;
}
.viewer iframe{
  width:100%;
  height:100%;
  border:none;
}

.spinner-overlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.spinner{
  width:60px;
  height:60px;
  border:6px solid #e5e7eb;
  border-top:6px solid #A67C00;
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Footer */
.footer{
  margin-top:18px;
  padding-top:12px;
  border-top:1px solid #eee;
  text-align:center;
  font-size:12px;
  color:#777;
}
.footer a{
  color:#C9A227;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo">

  <h2>Blantyre Secondary School</h2>
  <div class="subtitle">"Success Comes Through Discipline"</div>

  <form id="resultForm">
    <label for="examNo">Examination Number</label>
    <input type="text" id="examNo" required>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" required>

    <button type="submit">View Report</button>
  </form>

  <!-- ✅ Short footer inside the form card -->
  <div class="footer">
    © 2026 BSS • 
    <a href="https://wa.me/265XXXXXXXXX" target="_blank">JK DIGITAL HUB</a>
  </div>

</div>

<!-- FULL SCREEN PDF VIEWER -->
<div class="viewer" id="viewer">
  <iframe id="bigReportFrame"></iframe>
</div>

<div class="spinner-overlay" id="spinner">
  <div class="spinner"></div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzjbYEhAzo5dwOGFAYc6b7ueokt_cFxGqFENxz43Cnm8MxJ9Np7WFuaH28nrwrGEN8/exec";

const form = document.getElementById("resultForm");
const spinner = document.getElementById("spinner");
const viewer = document.getElementById("viewer");
const bigFrame = document.getElementById("bigReportFrame");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const examNo = document.getElementById("examNo").value.trim();
  const dob = document.getElementById("dob").value;

  spinner.style.display = "flex";

  try {
    const res = await fetch(`${API_URL}?examNo=${encodeURIComponent(examNo)}&dob=${dob}`);
    const data = await res.json();

    spinner.style.display = "none";

    if (data.status === "success") {
      viewer.style.display = "block";
      bigFrame.src = data.pdf;
    } else {
      alert("Result not found");
    }

  } catch (err) {
    spinner.style.display = "none";
    alert("Connection error");
  }
});
</script>
</body>
</html>
